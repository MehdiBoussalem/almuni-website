<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live</title>
    <link rel="stylesheet" href="../styles/live.css" />
    <style>
        .countdown-box {
            font-size: 1.5rem; /* taille du texte plus petite */
            padding: 10px 20px;
            border-radius: 10px;
            width: fit-content;
            margin: 0 auto 20px auto;
            background-color: black;
            color: white;
            text-align: center;
        }
    </style>
</head>
<body>
<header style="position:absolute; top:15px; left:15px;">
    <img src="../assets/logo_alumni.png" alt="Logo Alumni Ingémédia" style="width:140px; height:auto;">
</header>
    <div class="wrapper">
        <h2 style="text-align:center; color:#222; font-size:1.2rem; margin-top:5px; margin-bottom:20px;">Temps restant avant l'événement :</h2>
        <div class="countdown-box" aria-label="Compte à rebours">
            <span class="value" id="days">0</span> Jours :
            <span class="value" id="hours">0</span> Heures :
            <span class="value" id="minutes">0</span> Minutes :
            <span class="value" id="seconds">0</span> Secondes
        </div>
        <p style="text-align:center; color:#333; font-size:1.2rem; margin:10px 0; font-weight:600;">
            🎥 Live en direct sur <span style="color:#6441a5;">Twitch</span> ici
        </p>
        <div class="live-box">
            <iframe
                id="twitch-embed"
                title="Twitch Player"
                allowfullscreen
                scrolling="no"
                frameborder="0"
                width="100%"
                height="100%">
            </iframe>
        </div>
        <p style="text-align:center; color:#b30000; font-size:1.1rem; margin-top:15px; font-weight:bold;">
            Inscrivez-vous dès maintenant pour réserver vos places ! (limités)
        </p>
    </div>
    <div class="qr-container" style="text-align:center; margin-top:25px;">
        <img src="../assets/qrcode.png" alt="QR Code d'inscription" style="width:130px; height:130px; border-radius:10px; box-shadow:0 0 10px rgba(0,0,0,0.2);">
        <p style="font-size:1rem; color:#333; font-weight:500;">Scannez pour accéder à la page d'inscription</p>
    </div>
</body>
<script>
    // Configure Twitch embed with the exact current host as `parent`
    (function initTwitch() {
        const host = window.location.hostname; // e.g., 127.0.0.1 or localhost or yourdomain.com
        const twitchSrc = `https://player.twitch.tv/?channel=riotgames&parent=${host}&muted=true`;
        const iframe = document.getElementById('twitch-embed');
        if (iframe) iframe.src = twitchSrc;
    })();

    const targetDate = new Date("January 22, 2026 00:00:00").getTime();

    function updateCountdown() {
        const now = new Date().getTime();
        const distance = targetDate - now;

        const days = Math.floor(distance / (1000 * 60 * 60 * 24));
        const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((distance % (1000 * 60)) / 1000);

        document.getElementById("days").textContent = Math.max(days, 0);
        document.getElementById("hours").textContent = Math.max(hours, 0);
        document.getElementById("minutes").textContent = Math.max(minutes, 0);
        document.getElementById("seconds").textContent = Math.max(seconds, 0);

        if (distance < 0) {
            clearInterval(interval);
            document.querySelector(".countdown-box").style.color = "#e53935";
            document.querySelector(".live-box").innerHTML = "<p>LIVE EN DIRECT !</p>";
        }
    }

    const interval = setInterval(updateCountdown, 1000);
    updateCountdown();
</script>
</html>
